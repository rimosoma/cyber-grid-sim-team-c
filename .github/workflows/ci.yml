name: Automated Tests (CI)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Scarica il codice del repository
        uses: actions/checkout@v4

      - name: 2. Configura Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 3. Installa le librerie da requirements.txt
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: 4. Esegui i test automatici con Pytest
        run: |
          pytest -v